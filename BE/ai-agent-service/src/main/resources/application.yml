server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ai-agent-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/ai_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

# JWT Asymmetric Key Configuration (Consumer)
jwt:
  # Public Key Path ONLY - REQUIRED for token verification
  # NO DEFAULT VALUE - Must be set via environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  
  # Algorithm Configuration (must match issuer)
  algorithm: ${JWT_ALGORITHM:RSA}
  key-size: ${JWT_KEY_SIZE:2048}
  
  # Token Expiration (for validation checks)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

# Feign timeouts: bound the product-service lookup so a slow/down downstream
# can't hang chat requests - recommendations degrade to an empty list instead.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"
