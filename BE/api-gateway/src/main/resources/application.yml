server:
  port: 3001

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: '*'
            exposedHeaders: 'X-Request-Id,X-User-Id,X-User-Roles'
            allowCredentials: false
      # Strip duplicate CORS headers that downstream services add on top of gateway's own headers
      # (every service's own common-lib SecurityConfig also has a CorsConfigurationSource).
      # Without this, browser sees two values for these headers and can block the response —
      # covers Allow-Origin/Allow-Credentials plus Expose-Headers/Vary, which the gateway's own
      # globalcors filter and each downstream service both add independently.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Expose-Headers Vary, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**
        - id: category-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/categories/**
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/cart/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/orders/**
        - id: admin-order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/orders/**
        - id: sepay-webhook
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/payments/webhook/sepay
            - Method=POST
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/notifications/**
        - id: admin-notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/admin/notifications/**
        - id: ai-chat-service
          uri: ${AI_CHAT_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/ai-stylist/sessions/**,/api/v1/ai-stylist/knowledge/**
          filters:
            - RewritePath=/api/v1/ai-stylist/(?<segment>.*), /api/v1/$\{segment}
          metadata:
            response-timeout: 300000
            connect-timeout: 5000
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/ai-stylist/**
        - id: admin-ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/admin/ai/**
        - id: admin-users-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/users/**
        - id: admin-product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/products/**
        - id: admin-category-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/categories/**
        - id: internal-block
          uri: no://op
          predicates:
            - Path=/internal/v1/**
          filters:
            - SetStatus=401

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n'
