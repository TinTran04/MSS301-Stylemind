server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "X-Request-Id,X-User-Id,X-User-Roles"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: category-service
          uri: lb://product-service
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1
        - id: ai-service
          uri: lb://ai-agent-service
          predicates:
            - Path=/api/ai-stylist/**
          filters:
            - StripPrefix=1
        - id: admin-service
          uri: lb://product-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        - id: internal-block
          uri: "no://op"
          predicates:
            - Path=/internal/**

# JWT Asymmetric Key Configuration (Consumer)
jwt:
  # Public Key Path ONLY - REQUIRED for token verification
  # NO DEFAULT VALUE - Must be set via environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  
  # Algorithm Configuration (must match issuer)
  algorithm: ${JWT_ALGORITHM:RSA}
  key-size: ${JWT_KEY_SIZE:2048}
  
  # Token Expiration (for validation checks)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"