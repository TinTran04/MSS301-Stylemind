services:
  # ----------------------------------------------------
  # 1. Infrastructure Services (Profile: infra, all)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stylemind-redis
    ports:
      - "6379:6379"
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  qdrant:
    image: qdrant/qdrant:latest
    container_name: stylemind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  neo4j:
    image: neo4j:5-community
    container_name: stylemind-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    profiles:
      - infra
      - app
      - all

  minio:
    image: minio/minio:latest
    container_name: stylemind-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  # ----------------------------------------------------
  # 2. PostgreSQL Databases (Profile: infra, all)
  # ----------------------------------------------------
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./init-scripts/01-auth-db.sql:/docker-entrypoint-initdb.d/01-auth-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-user:/var/lib/postgresql/data
      - ./init-scripts/02-user-db.sql:/docker-entrypoint-initdb.d/02-user-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-product:
    image: postgres:15-alpine
    container_name: postgres-product
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-product:/var/lib/postgresql/data
      - ./init-scripts/03-product-db.sql:/docker-entrypoint-initdb.d/03-product-db.sql
      - ./init-scripts/04-product-seed-normalized-from-3-datasets.sql:/docker-entrypoint-initdb.d/04-product-seed-normalized-from-3-datasets.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-cart:
    image: postgres:15-alpine
    container_name: postgres-cart
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-cart:/var/lib/postgresql/data
      - ./init-scripts/05-cart-db.sql:/docker-entrypoint-initdb.d/05-cart-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-order:/var/lib/postgresql/data
      - ./init-scripts/06-order-db.sql:/docker-entrypoint-initdb.d/06-order-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-payment:/var/lib/postgresql/data
      - ./init-scripts/07-payment-db.sql:/docker-entrypoint-initdb.d/07-payment-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-ai:
    image: postgres:15-alpine
    container_name: postgres-ai
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-ai:/var/lib/postgresql/data
      - ./init-scripts/08-ai-db.sql:/docker-entrypoint-initdb.d/08-ai-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
      - ./init-scripts/09-notification-db.sql:/docker-entrypoint-initdb.d/09-notification-db.sql
    networks:
      - stylemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - app
      - all

  # ----------------------------------------------------
  # 4. API Gateway (Profile: app, all)
  # ----------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: stylemind/api-gateway:latest
    container_name: stylemind-gateway
    ports:
      - "3000:3000"
      - "5005:5005"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      CART_SERVICE_URL: ${CART_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - ./.docker/certs:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  # ----------------------------------------------------
  # 5. Auth Service (Profile: app, all)
  # ----------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: stylemind/auth-service:latest
    container_name: auth-service
    ports:
      - "8081:8081"
      - "5006:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      # Auth's shared security and Feign configuration use the canonical token.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SERVER_PORT: ${SERVER_PORT_AUTH}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  # ----------------------------------------------------
  # 6. Business Services (Profile: app, all)
  # ----------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: stylemind/user-service:latest
    container_name: user-service
    ports:
      - "8082:8082"
      - "5007:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SERVER_PORT: ${SERVER_PORT_USER}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: stylemind/product-service:latest
    container_name: product-service
    ports:
      - "8083:8083"
      - "5008:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SERVER_PORT: ${SERVER_PORT_PRODUCT}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-product:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    image: stylemind/cart-service:latest
    container_name: cart-service
    ports:
      - "8086:8086"
      - "5011:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-cart:5432/cart_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      SERVER_PORT: ${SERVER_PORT_CART}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-cart:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: stylemind/order-service:latest
    container_name: order-service
    ports:
      - "8087:8087"
      - "5012:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      CART_SERVICE_URL: ${CART_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SERVER_PORT: ${SERVER_PORT_ORDER}
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-order:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: stylemind/payment-service:latest
    container_name: payment-service
    ports:
      - "8088:8088"
      - "5013:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      SERVER_PORT: ${SERVER_PORT_PAYMENT}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      SEPAY_BANK_SHORT_NAME: ${SEPAY_BANK_SHORT_NAME}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME}
      SEPAY_BANK_HUB_PREFIX: ${SEPAY_BANK_HUB_PREFIX}
      SEPAY_PAYMENT_EXPIRE_MINUTES: ${SEPAY_PAYMENT_EXPIRE_MINUTES}
      SEPAY_QR_BASE_URL: ${SEPAY_QR_BASE_URL}
      SEPAY_ENABLED: ${SEPAY_ENABLED}
      SEPAY_MODE: ${SEPAY_MODE}
      SEPAY_PAYMENT_CODE_PREFIX: ${SEPAY_PAYMENT_CODE_PREFIX}
      SEPAY_WEBHOOK_AUTH_MODE: ${SEPAY_WEBHOOK_AUTH_MODE}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY}
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: stylemind/notification-service:latest
    container_name: notification-service
    ports:
      - "8089:8089"
      - "5014:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_KEY_SIZE: ${JWT_KEY_SIZE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}

      SERVER_PORT: ${SERVER_PORT_NOTIFICATION}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

      MAIL_ENABLED: ${MAIL_ENABLED}
      # Notification's current YAML explicitly reads X_INTERNAL_TOKEN. auth-service and
      # order-service send the canonical INTERNAL_TOKEN value as X-Internal-Token, so
      # Notification's X_INTERNAL_TOKEN binding must carry that same value (not a separate
      # X_INTERNAL_TOKEN .env value) or internal calls to /internal/v1/notifications/email are
      # rejected with 403 by InternalAuthFilter.
      X_INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MAIL_LOG_FALLBACK: ${MAIL_LOG_FALLBACK:-true}

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}

      APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-StyleMind}

      MANAGEMENT_HEALTH_MAIL_ENABLED: true
    volumes:
      - ./.docker/certs:/app/certs:ro
    depends_on:
      postgres-notification:
        condition: service_healthy
    networks:
      - stylemind-network
    profiles:
      - app
      - all

networks:
  stylemind-network:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-user:
  pgdata-product:
  pgdata-cart:
  pgdata-order:
  pgdata-payment:
  pgdata-ai:
  pgdata-notification:
  qdrant_data:
  neo4j_data:
  minio_data:
