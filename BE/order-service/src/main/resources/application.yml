server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: order-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

internal:
  token: ${INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

# Auth-service is only used to look up a user's email for order notifications.
auth:
  service:
      url: ${AUTH_SERVICE_URL}
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}

app:
  order:
    # 15 min mirrors the SePay VietQR window (payment-service app.vietqr.expiry-minutes)
    # so the QR shown to the customer expires around the same time the order does.
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    timeout-job-interval-ms: ${ORDER_TIMEOUT_JOB_INTERVAL_MS:300000}

# Feign timeouts: bound every outbound call so a slow/down downstream service
# (cart, product, payment) can't hang order-service threads indefinitely.
# Conservative defaults; tune per-client as needed. See ARCHITECTURE_AND_QUALITY_REVIEW.md M1.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

# JWT Asymmetric Key Configuration (Consumer)
jwt:
  # Public Key Path ONLY - REQUIRED for token verification
  # NO DEFAULT VALUE - Must be set via environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  
  # Algorithm Configuration (must match issuer)
  algorithm: ${JWT_ALGORITHM:RSA}
  key-size: ${JWT_KEY_SIZE:2048}
  
  # Token Expiration (for validation checks)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.order: DEBUG
    com.stylemind.order.feign: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"
