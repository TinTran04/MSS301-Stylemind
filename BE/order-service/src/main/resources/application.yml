server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: order-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

# Auth-service is only used to look up a user's email for order notifications.
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8089}

app:
  order:
    # 15 min mirrors the SePay VietQR window (payment-service app.vietqr.expiry-minutes)
    # so the QR shown to the customer expires around the same time the order does.
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    timeout-job-interval-ms: ${ORDER_TIMEOUT_JOB_INTERVAL_MS:300000}

# Feign timeouts: bound every outbound call so a slow/down downstream service
# (cart, product, payment) can't hang order-service threads indefinitely.
# Conservative defaults; tune per-client as needed. See ARCHITECTURE_AND_QUALITY_REVIEW.md M1.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

jwt:
  secret: ${JWT_SECRET:super-secure-stylemind-secret-key-signature-2026-xyz}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.order: DEBUG
    com.stylemind.order.feign: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"