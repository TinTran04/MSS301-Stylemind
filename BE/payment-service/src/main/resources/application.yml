server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: payment-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

app:
  vietqr:
    # Local dev still uses init-scripts for schema and env-backed config for SePay/VietQR.
    bank-id: ${SEPAY_BANK_SHORT_NAME:VCB}
    account-no: ${SEPAY_ACCOUNT_NUMBER:1234567890}
    account-name: ${SEPAY_ACCOUNT_NAME:TEST_ACCOUNT}
    required-transfer-prefix: ${SEPAY_BANK_HUB_PREFIX:SEVQR}
    expiry-minutes: ${SEPAY_PAYMENT_EXPIRE_MINUTES:15}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://img.vietqr.io/image}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    mode: ${SEPAY_MODE:live}
    payment-code-prefix: ${SEPAY_PAYMENT_CODE_PREFIX:STYLEMIND}
    webhook-auth-mode: ${SEPAY_WEBHOOK_AUTH_MODE:API_KEY}
    # SePay sends "Authorization: Apikey <this value>" on every webhook call -
    # this is how we verify the webhook is genuinely from SePay (§SEC-06). The
    # This value is mandatory at runtime and must never have a committed fallback.
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:test-dev-api-key}

# JWT Asymmetric Key Configuration (Consumer)
jwt:
  # Public Key Path ONLY - REQUIRED for token verification
  # NO DEFAULT VALUE - Must be set via environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  
  # Algorithm Configuration (must match issuer)
  algorithm: ${JWT_ALGORITHM:RSA}
  key-size: ${JWT_KEY_SIZE:2048}
  
  # Token Expiration (for validation checks)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"
