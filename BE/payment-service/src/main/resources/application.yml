server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: payment-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8087}

# VietQR bank/account the QR points at - a SePay sandbox/test account in dev,
# a real one only for the demo (see GUARDRAILS). Never hardcode a real account.
app:
  vietqr:
    bank-id: ${VIETQR_BANK_ID:970436}
    account-no: ${VIETQR_ACCOUNT_NO:0123456789}
    account-name: ${VIETQR_ACCOUNT_NAME:STYLEMIND SANDBOX}
    expiry-minutes: ${VIETQR_EXPIRY_MINUTES:15}
  sepay:
    # SePay sends "Authorization: Apikey <this value>" on every webhook call -
    # this is how we verify the webhook is genuinely from SePay (§SEC-06). The
    # default below is a dev-only placeholder; production MUST set a real secret
    # via env var, never commit one.
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:sepay-sandbox-webhook-key-2026}

jwt:
  secret: ${JWT_SECRET:super-secure-stylemind-secret-key-signature-2026-xyz}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"