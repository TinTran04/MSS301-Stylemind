server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: payment-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8087}

app:
  vietqr:
    # Local dev still uses init-scripts for schema and env-backed config for SePay/VietQR.
    bank-id: ${SEPAY_BANK_SHORT_NAME}
    account-no: ${SEPAY_ACCOUNT_NUMBER}
    account-name: ${SEPAY_ACCOUNT_NAME}
    required-transfer-prefix: ${SEPAY_BANK_HUB_PREFIX:SEVQR}
    expiry-minutes: ${SEPAY_PAYMENT_EXPIRE_MINUTES:15}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://img.vietqr.io/image}
  sepay:
    enabled: ${SEPAY_ENABLED:true}
    mode: ${SEPAY_MODE:live}
    payment-code-prefix: ${SEPAY_PAYMENT_CODE_PREFIX:STYLEMIND}
    webhook-auth-mode: ${SEPAY_WEBHOOK_AUTH_MODE:API_KEY}
    # SePay sends "Authorization: Apikey <this value>" on every webhook call -
    # this is how we verify the webhook is genuinely from SePay (§SEC-06). The
    # This value is mandatory at runtime and must never have a committed fallback.
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY}

jwt:
  secret: ${JWT_SECRET:super-secure-stylemind-secret-key-signature-2026-xyz}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stylemind.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"
