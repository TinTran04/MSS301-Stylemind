server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: product-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/product_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# JWT Asymmetric Key Configuration (Consumer)
jwt:
  # Public Key Path ONLY - REQUIRED for token verification
  # NO DEFAULT VALUE - Must be set via environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  
  # Algorithm Configuration (must match issuer)
  algorithm: ${JWT_ALGORITHM:RSA}
  key-size: ${JWT_KEY_SIZE:2048}
  
  # Token Expiration (for validation checks)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:stylemind/products}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

internal:
  token: ${X_INTERNAL_TOKEN:sm-secret-internal-service-token-key-2026}

app:
  product:
    default-currency: ${PRODUCT_DEFAULT_CURRENCY:VND}

logging:
  level:
    com.stylemind.product: DEBUG
    com.cloudinary: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{X-Request-Id:-}] [%thread] %-5level %logger{36} - %msg%n"
